---
- name: Install SSH server
  ansible.builtin.apt:
    name: openssh-server
    state: present
    update_cache: true

- name: Deploy sshd_config
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: '0644'
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Flush SSH restart before connection changes matter
  ansible.builtin.meta: flush_handlers
