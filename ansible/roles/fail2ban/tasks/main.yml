---
- name: Validate fail2ban lifecycle state
  ansible.builtin.assert:
    that:
      - fail2ban_state in ['enabled', 'disabled', 'removed']
      - fail2ban_enabled is not defined
      - fail2ban_managed is not defined
    fail_msg: "Use fail2ban_state: enabled, disabled or removed; replace legacy fail2ban_enabled/fail2ban_managed variables."

- name: Configure enabled fail2ban
  ansible.builtin.import_tasks: enabled.yml
  when: fail2ban_state == 'enabled'

- name: Disable fail2ban without removing its files
  ansible.builtin.import_tasks: disabled.yml
  when: fail2ban_state in ['disabled', 'removed']

- name: Remove fail2ban installation and managed config
  ansible.builtin.import_tasks: removed.yml
  when: fail2ban_state == 'removed'
