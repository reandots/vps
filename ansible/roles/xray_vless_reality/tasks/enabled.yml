---
- name: Validate required Xray variables
  ansible.builtin.assert:
    that:
      - xray_vless_uuid is defined
      - xray_vless_uuid | length > 0
      - xray_reality_private_key is defined
      - xray_reality_private_key | length > 0
      - xray_reality_short_ids is defined
      - xray_reality_short_ids | length > 0
      - xray_reality_server_names | length > 0
    fail_msg: "Define Xray variables in ansible/inventories/host_vars/<host>/vault.yml before enabling Xray."
  no_log: true

- name: Inspect actual Xray installation
  ansible.builtin.import_tasks: inspect.yml

- name: Install or repair Xray release
  ansible.builtin.import_tasks: install.yml
  when:
    - xray_install_required
    - not ansible_check_mode

- name: Report required Xray installation in check mode
  ansible.builtin.debug:
    msg: "Xray installation or repair is required; run without check mode to install and validate the release."
  changed_when: true
  when:
    - xray_install_required
    - ansible_check_mode

- name: Configure installed Xray
  ansible.builtin.import_tasks: configure.yml
  when: not (ansible_check_mode and xray_install_required)
