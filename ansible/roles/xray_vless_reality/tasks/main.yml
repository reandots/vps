---
- name: Validate Xray lifecycle state
  ansible.builtin.assert:
    that:
      - xray_state in ['enabled', 'disabled', 'removed']
      - xray_enabled is not defined
      - xray_managed is not defined
    fail_msg: "Use xray_state: enabled, disabled or removed; replace legacy xray_enabled/xray_managed variables."

- name: Configure enabled Xray
  ansible.builtin.import_tasks: enabled.yml
  when: xray_state == 'enabled'

- name: Disable Xray without removing its files
  ansible.builtin.import_tasks: disabled.yml
  when: xray_state in ['disabled', 'removed']

- name: Remove Xray installation and managed config
  ansible.builtin.import_tasks: removed.yml
  when: xray_state == 'removed'
