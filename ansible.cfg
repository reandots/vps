[defaults]
inventory = ansible/inventories/hosts.yml
roles_path = ansible/roles
collections_paths = .ansible/collections:~/.local/share/ansible/collections:/usr/share/ansible/collections
host_key_checking = True
retry_files_enabled = False
interpreter_python = auto_silent
timeout = 30

local_tmp = ~/.cache/ansible/tmp
remote_tmp = ~/.cache/ansible/remote_tmp
log_path = ~/.local/state/ansible/ansible.log

[privilege_escalation]
become = False
become_method = sudo
become_ask_pass = False

[ssh_connection]
control_path_dir = ~/.cache/ansible/cp
